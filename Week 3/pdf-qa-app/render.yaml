# render.yaml - Render Blueprint for DocuMind Backend & Services

services:
  # Express Node.js Backend API
  - type: web
    name: documind-backend
    env: node
    region: singapore
    rootDir: Week 3/pdf-qa-app/backend
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CHROMA_URL
        fromService:
          type: web
          name: documind-chroma
          property: host
      - key: MAX_CHUNKS_PER_PDF
        value: 500
      - key: TOP_K_CHUNKS
        value: 3
      - key: HISTORY_LIMIT
        value: 6

  # ChromaDB Python Vector Server
  - type: web
    name: documind-chroma
    env: python
    region: singapore
    rootDir: Week 3/pdf-qa-app/backend
    buildCommand: pip install chromadb
    startCommand: python -m chromadb.cli.cli run --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000

databases:
  # Managed PostgreSQL Database
  - name: documind-postgres
    databaseName: pdfqa
    user: postgres
    region: singapore
